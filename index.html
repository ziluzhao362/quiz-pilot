      // GitHub Pages SPA 回退恢复：配合站点根 404.html 使用
      (function () {
        var r = sessionStorage.getItem('spa-redirect');
        if (r) {
          sessionStorage.removeItem('spa-redirect');
          window.history.replaceState(null, '', r);
        }
      })();
    </script>
